<svg xmlns="http://www.w3.org/2000/svg" width="840" height="432" viewBox="0 0 840 432" fill="none" role="img" aria-labelledby="pipeline-title pipeline-description">
  <title id="pipeline-title">Antenna pipeline: design, simulate, fabricate, measure, check and compare</title>
  <desc id="pipeline-description">Design five FR4 patch shapes for a 2.45 GHz target, simulate them in CST, fabricate copper patches, and measure S11 and VSWR with a VNA. Python checks VSWR and bandwidth using values manually recorded from CST and VNA reports, then generates comparison tables and plots. The arrows show the study sequence; they do not represent automatic data transfer. Original sweeps are not included, and source discrepancies remain unresolved.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#55C4E0"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { fill: #E7EDED; font-size: 28px; font-weight: 700; }
      .meta { fill: #A8B5BD; font-size: 18px; }
      .stage rect { fill: #1B2327; stroke: #CAD4D9; stroke-width: 1.5; }
      .analysis rect { stroke: #55C4E0; }
      .number { fill: #55C4E0; font-size: 16px; font-weight: 600; }
      .heading { fill: #E7EDED; font-size: 28px; font-weight: 600; }
      .body { fill: #BEC9CF; font-size: 20px; }
      .connector { fill: none; stroke: #55C4E0; stroke-width: 2; stroke-linejoin: round; }
      .note { fill: #A8B5BD; font-size: 17px; }
    </style>
  </defs>
  <rect width="840" height="432" fill="#14191C"/>
  <text class="title" x="28" y="43">ANTENNA PIPELINE</text>
  <text class="meta" x="812" y="42" text-anchor="end">2.45 GHz target</text>
  <path d="M28 64H812" stroke="#71818B" stroke-width="1"/>

  <g id="stage-01" class="stage study">
    <rect x="28" y="88" width="244" height="112" rx="8"/>
    <text class="number" x="48" y="114">01</text>
    <text class="heading" x="48" y="147">Design</text>
    <text class="body" x="48" y="176">Five shapes · FR4</text>
  </g>

  <g id="stage-02" class="stage study">
    <rect x="298" y="88" width="244" height="112" rx="8"/>
    <text class="number" x="318" y="114">02</text>
    <text class="heading" x="318" y="147">Simulate</text>
    <text class="body" x="318" y="176">CST · S11 + bandwidth</text>
  </g>

  <g id="stage-03" class="stage study">
    <rect x="568" y="88" width="244" height="112" rx="8"/>
    <text class="number" x="588" y="114">03</text>
    <text class="heading" x="588" y="147">Fabricate</text>
    <text class="body" x="588" y="176">Copper patches</text>
  </g>

  <g id="stage-04" class="stage study">
    <rect x="28" y="264" width="244" height="112" rx="8"/>
    <text class="number" x="48" y="290">04</text>
    <text class="heading" x="48" y="323">Measure</text>
    <text class="body" x="48" y="352">VNA · S11 + VSWR</text>
  </g>

  <g id="stage-05" class="stage analysis">
    <rect x="298" y="264" width="244" height="112" rx="8"/>
    <text class="number" x="318" y="290">05</text>
    <text class="heading" x="318" y="323">Check</text>
    <text class="body" x="318" y="352">VSWR + bandwidth</text>
  </g>

  <g id="stage-06" class="stage analysis">
    <rect x="568" y="264" width="244" height="112" rx="8"/>
    <text class="number" x="588" y="290">06</text>
    <text class="heading" x="588" y="323">Compare</text>
    <text class="body" x="588" y="352">Tables + plots</text>
  </g>

  <path class="connector" d="M274 144H290" marker-end="url(#arrow)"/>
  <path class="connector" d="M544 144H560" marker-end="url(#arrow)"/>
  <path class="connector" d="M690 202V232H150V256" marker-end="url(#arrow)"/>
  <path class="connector" d="M274 320H290" marker-end="url(#arrow)"/>
  <path class="connector" d="M544 320H560" marker-end="url(#arrow)"/>

  <text class="note" x="28" y="411">Python checks values manually recorded from CST and VNA reports.</text>
</svg>
